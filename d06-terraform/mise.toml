[env]
_.file = ".env"
#______________________________________________________________________________

[tools]
aws-cli = { version = "latest", symlink_bins = "true" }
eza = "latest"
terraform = "latest"
"github:hashicorp/terraform-ls" = "latest"
#______________________________________________________________________________

[shell_alias]
menu = "echo; mise shell-alias ls; echo"
tree = "eza --tree --all --git-ignore"

tfi = "terraform init"

tfv = "terraform validate"
tff = "terraform fmt -recursive"

tfp = "terraform plan -out=.tfplan -var-file=$TFVAR_FILE_PATH"
tfa = "terraform apply .tfplan"

tfo = "terraform output"

tfs = "terraform state list"
tfd = "terraform destroy -var-file=$TFVAR_FILE_PATH"
#______________________________________________________________________________
