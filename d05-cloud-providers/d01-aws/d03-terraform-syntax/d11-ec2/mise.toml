[env]

# AWS Settings (used by aws-cli and Terraform)
AWS_ENDPOINT_URL = "http://localhost.floci.io:4566"
AWS_DEFAULT_REGION = "eu-north-1"
AWS_ACCESS_KEY_ID = "test"
AWS_SECRET_ACCESS_KEY = "test"

# Floci container settings (documented FLOCI_* variables)
FLOCI_BASE_URL = "http://localhost.floci.io:4566"
FLOCI_DEFAULT_REGION = "eu-north-1"
FLOCI_DEFAULT_AVAILABILITY_ZONE = "eu-north-1a"

# Host-side data folder, read by .mise-tasks/f-start.bash (not a Floci variable)
FLOCI_DATA_DIR = "{{env.HOME}}/.floci-aws-data"

#______________________________________________________________________________

[tools]

aws-cli = { version = "latest", symlink_bins = "true" }
"github:floci-io/floci-cli" = "latest"
kubectl = "latest"
minikube = "latest"
terraform = "latest"
"github:hashicorp/terraform-ls" = "latest"

#______________________________________________________________________________

[shell_alias]

# SUB_SECTION: 🐳 Docker
d-containers = "mise d-containers"
d-images = "mise d-images"
d-ports = "mise d-ports"
d-status = "mise d-status"
d-toggle = "mise d-toggle"
d-volumes = "mise d-volumes"
d-tidy = "mise d-tidy"

# SUB_SECTION: 🍿 Floci
f-start = "mise f-start"
f-status = "mise f-status"
f-stop = "mise f-stop"
f-destroy = "sudo rm -rf ~/.floci-aws-data"

# SUB_SECTION: ☸️ kubectl
k8 = "mise k8"

# SUB_SECTION: 🧊 MiniKube
mk-start = "mise mk-start"
mk-stop = "mise mk-stop"
mk-delete = "mise mk-delete"

# SUB_SECTION: 🏡 Terraform
fmt-all = "terraform fmt --recursive"
