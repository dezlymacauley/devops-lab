apiVersion: v1
kind: Pod
metadata:
  name: "grade-submission-portal"
  labels:
    app.kubernetes.io/name: grade-submission
    app.kubernetes.io/instance: grade-submission-portal
    app.kubernetes.io/component: frontend
spec:
  containers:
    - name: grade-submission-portal
      image: "rslim087/kubernetes-course-grade-submission-portal:latest"
      resources:
        requests:
          memory: "128Mi"
          cpu: "200m"
        limits:
          memory: "128Mi"
      ports:
        - containerPort: 5001

    # This will be used to make requests to `grade-submission-portal`
    - name: grade-submission-portal-health-checker
      image: "rslim087/kubernetes-course-grade-submission-portal-health-checker:latest"
      resources:
        requests:
          memory: "128Mi"
          cpu: "200m"
        limits:
          memory: "128Mi"
